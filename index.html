<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:title" content="나루 스토어">
<meta property="og:description" content="나루 — GitHub의 좋은 프로그램을 검증해서 설치 버튼 하나로 받는 스토어. PC: PhotoCraft · 안드로이드: DroidDeck.">
<meta name="theme-color" content="#070c13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%235ad08a'/%3E%3Cpath d='M8.5 12.5l4.5 4.5 10.5-10.5' fill='none' stroke='%2305200f' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M6 23.5c3-2.4 6-2.4 9 0s6 2.4 9 0 2.4-1.6 2.4-1.6' fill='none' stroke='%2305200f' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>나루 스토어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: night-harbor storefront split into a PC store and an Android store; every app page is rendered from that app's own data (bottom tabs on phones, top nav on desktop). Sticky top bar, Steam-style featured capsule and shelves, Play-style rows with install pills; the product page is a main column plus an install rail on desktop, one stacked column with the install box first on phones. */
  color-scheme: dark;
  --bg:#0c141d;
  --bg-deep:#070c13;
  --bar:rgba(7,12,19,.94);
  --scrim:rgba(2,6,10,.68);
  --panel:#122030;
  --panel-hi:#192b40;
  --line:#1f3249;
  --line-strong:#2d4663;
  --text:#dbe5ee;
  --text-dim:#93a7bb;
  --text-faint:#667b90;
  --sky:#7cc4ff;
  --sky-soft:rgba(124,196,255,.14);
  --go:#5ad08a;
  --go-ink:#05200f;
  --go-soft:rgba(90,208,138,.14);
  --gold:#f0c35e;
  --gold-soft:rgba(240,195,94,.14);
  --warn:#f2a64a;
  --warn-soft:rgba(242,166,74,.14);
  --bad:#f0716a;
  --bad-soft:rgba(240,113,106,.14);
  --mixed:#c9a86a;
  --glow:rgba(56,132,214,.20);
  --icon-a:#2d7ff0;
  --icon-b:#22a2c9;
  --icon-c:#3cc596;
  --pc-a:#f5a524;
  --pc-b:#e5486e;
  --mock-screen:#0b1826;
  --mock-bezel:#2a3f58;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-display:"Barlow Condensed","IBM Plex Sans KR","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:16px;
  --r-md:12px;
  --r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background-color:var(--bg)}
body{margin:0;background-image:radial-gradient(900px 420px at 78% -120px,var(--glow),transparent 70%);background-repeat:no-repeat;color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg-deep)}
body.locked{overflow:hidden}
a{color:var(--sky);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
button{font-family:inherit}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-dim)}
.ico{display:inline-flex;width:1.1em;height:1.1em;flex:none;vertical-align:-.15em}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.fill svg{fill:currentColor;stroke:none}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(140%) blur(10px);backdrop-filter:saturate(140%) blur(10px)}
.topbar-in{display:flex;align-items:center;gap:22px;height:58px}
.brand{display:flex;align-items:center;gap:9px;color:var(--text)}
.brand:hover{text-decoration:none}
.logo{width:30px;height:30px;flex:none}
.logo .lg-bg{fill:var(--go)}
.logo .lg-mark{fill:none;stroke:var(--go-ink);stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand-latin{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.2em;color:var(--text-faint);padding-top:2px}
.topnav{display:none;gap:2px}
.topnav a{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:8px;white-space:nowrap}
.topnav a .ico{width:16px;height:16px}
.topnav a:hover{color:var(--text);text-decoration:none}
.topnav a[aria-current=page]{color:var(--text);background:var(--panel)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px}
.lang button{border:0;background:transparent;color:var(--text-dim);font:600 12.5px/1 var(--font-ui);padding:7px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--panel-hi);color:var(--text)}
.who{display:flex;align-items:center;gap:7px}
.who img{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong)}
.role-pill{font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
@media (min-width:900px){.topnav{display:flex}}

/* bottom tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--text-faint);font-size:11px;font-weight:600;position:relative;white-space:nowrap;min-width:0}
.tabbar a:hover{text-decoration:none}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current=page]{color:var(--sky)}
.tabbar a[aria-current=page]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;border-radius:2px;background:var(--sky)}
@media (min-width:900px){.tabbar{display:none}}

main{display:block;padding-block:20px 36px;outline:none}
@media (min-width:900px){main{padding-block:28px 48px}}
.foot{padding-block:22px calc(96px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--text-faint);font-size:12.5px;line-height:1.7}
.foot p+p{margin-top:6px}
@media (min-width:900px){.foot{padding-block:24px 40px}}

/* shared pieces */
.stack{display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sec-sub{color:var(--text-dim);font-size:13.5px;white-space:nowrap}
.sec-link{font-size:14px;font-weight:600;white-space:nowrap}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lead{color:var(--text);font-size:15.5px;max-width:65ch}
.note{font-size:13.5px;color:var(--text-dim)}
.err{color:var(--bad);font-size:13.5px}
.okmsg{color:var(--go);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.empty{padding:22px 16px;border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--text-dim);font-size:14px;text-align:center}
.page-head{display:flex;flex-direction:column;gap:10px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.02em}
@media (min-width:900px){.page-title{font-size:34px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:700 15px/1 var(--font-ui);cursor:pointer;white-space:nowrap;transition:filter .15s,background-color .15s;color:var(--text)}
.btn:hover{text-decoration:none}
.btn .ico{width:18px;height:18px}
.btn-go{background:var(--go);color:var(--go-ink)}
.btn-go:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--panel-hi)}
.btn-quiet{background:var(--panel-hi);color:var(--text)}
.btn-quiet:hover{filter:brightness(1.12)}
.btn-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn-sm{min-height:34px;padding:0 14px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel-hi);color:var(--text);cursor:pointer;flex:none}
.icon-btn .ico{width:18px;height:18px}

.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;background:var(--panel-hi);color:var(--text-dim);white-space:nowrap}
.badge .ico{width:14px;height:14px}
.badge.ok{background:var(--go-soft);color:var(--go)}
.badge.sky{background:var(--sky-soft);color:var(--sky)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;color:var(--sky);background:var(--sky-soft);padding:3px 10px;border-radius:5px}
.plats{display:flex;flex-wrap:wrap;gap:6px}
.plat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-faint);white-space:nowrap}
.plat .ico{width:14px;height:14px}
.plat.on{border-color:var(--go);color:var(--go);background:var(--go-soft)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:transparent;color:var(--text-dim);border-radius:999px;padding:8px 14px;font:600 13.5px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:var(--sky-soft);border-color:var(--sky);color:var(--text)}
.chip .count{color:var(--text-faint);margin-left:5px;font-weight:500;font-variant-numeric:tabular-nums}

.appicon{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--icon-a) 0%,var(--icon-b) 55%,var(--icon-c) 100%);color:var(--text);font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.03em;flex:none;box-shadow:inset 0 0 0 1px var(--line-strong)}
.appicon.lg{width:84px;height:84px;border-radius:20px;font-size:32px}
.appicon.sm{width:44px;height:44px;border-radius:11px;font-size:18px}
.appicon.repo{background:var(--panel-hi);color:var(--text-dim);font-size:18px}

.stars{display:inline-flex;gap:1px;color:var(--gold);vertical-align:-2px}
.stars .ico{width:14px;height:14px}
.stars .off{color:var(--line-strong)}
.rating-chip{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--text);background:var(--panel-hi);padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rating-chip .ico{width:12px;height:12px;color:var(--gold)}
.rv-label{font-weight:700}
.rv-pos{color:var(--sky)}
.rv-mixed{color:var(--mixed)}
.rv-neg{color:var(--bad)}
.rv-none{color:var(--text-dim)}

/* price box + install */
.buy{display:inline-flex;align-items:stretch;border-radius:999px;background:var(--bg-deep);border:1px solid var(--line);max-width:100%}
.buy .price{display:flex;align-items:center;gap:6px;padding:0 14px 0 18px;font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.05em;color:var(--text);white-space:nowrap}
.buy .price small{font-size:13px;letter-spacing:.1em;color:var(--text-faint)}
.buy .btn{border-radius:999px}
.buy.wide{display:flex;width:100%}
.buy.wide .btn{flex:1}

/* store header */
.store-head{display:flex;flex-direction:column;gap:6px}
.store-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.store-head .sub{color:var(--text-dim);font-size:14px;max-width:70ch}
@media (min-width:900px){.store-head h1{font-size:30px}}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-md);background:var(--sky-soft);color:var(--text);font-size:13.5px;margin-top:6px}
.hint>.ico{color:var(--sky);width:18px;height:18px;margin-top:2px}
.hint a{font-weight:600}

/* home: featured capsule */
.feature{position:relative;display:grid;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:border-color .2s}
.feature:hover{border-color:var(--line-strong)}
.feature-art{aspect-ratio:16/8.6;max-width:100%;background:var(--bg-deep)}
.feature-art svg{display:block;width:100%;height:100%}
.art-img{display:block;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:center top}
.feature-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--panel-hi),var(--panel))}
.feature-title{font-family:var(--font-display);font-weight:700;font-size:42px;letter-spacing:.01em;line-height:1}
.feature-title a{color:var(--text)}
.feature-title a:hover{text-decoration:none}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}
.feature-pitch{color:var(--text);font-size:15px;max-width:44ch}
.feature-rv{font-size:14px;color:var(--text-dim)}
.feature-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px;position:relative;z-index:2}
.feature-foot .src{font-size:12.5px;color:var(--text-faint)}
@media (min-width:900px){
  .feature{grid-template-columns:1.6fr 1fr}
  .feature-art{aspect-ratio:auto;min-height:340px}
  .feature-body{padding:28px 28px 26px;justify-content:flex-end}
  .feature-title{font-size:52px}
}

/* PC store before its first app */
.empty-hero{display:grid;gap:20px;padding:22px;border-radius:var(--r-lg);border:1px dashed var(--line-strong);background:linear-gradient(160deg,var(--panel-hi),var(--panel) 60%)}
.empty-hero h2{font-size:22px;margin:4px 0 8px}
@media (min-width:900px){.empty-hero{grid-template-columns:1.2fr 1fr;align-items:center;padding:32px}.empty-hero h2{font-size:26px}}
.ftypes{display:grid;gap:8px}
.ftype{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--bg-deep);border:1px solid var(--line)}
.ftype b{font-family:var(--font-display);font-size:16px;letter-spacing:.1em;color:var(--gold)}
.ftype span{color:var(--text-dim);font-size:13.5px}
.ftype.me{border-color:var(--go)}
.ftype.me b{color:var(--go)}

.trust{display:grid;gap:10px}
@media (min-width:720px){.trust{grid-template-columns:repeat(3,1fr)}}
.trust-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line)}
.trust-item>.ico{width:22px;height:22px;color:var(--go);margin-top:2px}
.trust-item strong{display:block;font-size:15px}
.trust-item span{display:block;color:var(--text-dim);font-size:13.5px}

/* list rows (Play style) */
.rows{display:flex;flex-direction:column}
.row{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row-name{font-weight:600;font-size:16px}
.row-name a{color:var(--text)}
.row-name a::after{content:"";position:absolute;inset:0}
.row-name a:hover{text-decoration:none}
.row-meta{color:var(--text-dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .btn,.row .status{position:relative;z-index:1}
.pill-install{min-height:36px;padding:0 18px;font-size:14px}

.cta-band{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r-lg);border:1px solid var(--line);background:linear-gradient(120deg,var(--panel-hi),var(--panel) 60%)}
.cta-band h2{font-size:18px}
@media (min-width:720px){.cta-band{flex-direction:row;align-items:center;justify-content:space-between}}

/* app page */
.crumbs{font-size:13px;color:var(--text-faint);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.crumbs a{color:var(--text-dim)}
.app-head{display:flex;gap:16px;align-items:center}
.app-id{display:flex;flex-direction:column;gap:6px;min-width:0}
.app-title{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em}
.app-dev{font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;width:max-content}
.app-dev .ico{width:14px;height:14px}
@media (min-width:900px){.app-title{font-size:52px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.stat b .ico{width:13px;height:13px;color:var(--gold)}
.stat span{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:960px){.stats{max-width:640px;border:0;margin-top:20px}.stat{text-align:left;padding:0 18px}.stat:first-child{padding-left:0}.stat b{justify-content:flex-start}}

.detail{display:flex;flex-direction:column;gap:24px;margin-top:20px}
.col-main,.col-side{display:contents}
.s-buy{order:1}.s-device{order:2}.s-media{order:3}.s-about{order:4}.s-rvsum{order:5}.s-note{order:6}.s-verify{order:7}.s-req{order:8}.s-guide{order:9}.s-history{order:10}.s-info{order:11}.s-reviews{order:12}.s-ask{order:13}
@media (min-width:960px){
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:30px;align-items:start;margin-top:26px}
  .col-main,.col-side{display:flex;flex-direction:column;gap:28px;min-width:0}
  .col-side{gap:16px}
}
.buybox{display:flex;flex-direction:column;gap:12px}
.buybox-title{font-size:16px;font-weight:700}
.buy-note{font-size:12.5px;color:var(--text-dim)}
.plat-line{display:flex;flex-direction:column;gap:6px}
.plat-line .k{font-size:12px;color:var(--text-faint);font-weight:600}

.devcard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel)}
.devcard .di{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel-hi);color:var(--text-dim)}
.devcard .di .ico{width:22px;height:22px}
.devcard.ok{border-color:var(--go-soft)}
.devcard.ok .di{background:var(--go-soft);color:var(--go)}
.devcard.warn .di{background:var(--warn-soft);color:var(--warn)}
.devcard.bad .di{background:var(--bad-soft);color:var(--bad)}
.devcard.info .di{background:var(--sky-soft);color:var(--sky)}
.devcard .k{font-size:12px;color:var(--text-faint);font-weight:600}
.devcard strong{display:block;font-size:15px;margin-top:1px}
.devcard p{color:var(--text-dim);font-size:13.5px;margin-top:3px}
.devcard .detected{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:7px;overflow-wrap:anywhere}

.shots{display:grid;grid-auto-flow:column;grid-auto-columns:min(86%,460px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.shot{scroll-snap-align:start;border-radius:var(--r-md);overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;margin:0}
.shot-art{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--bg-deep)}
.shot-art>svg{display:block;width:100%;height:100%}
.shot-cap{padding:9px 12px;font-size:13px;color:var(--text-dim)}
.step-art{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px;align-items:center;padding:16px 18px;background:radial-gradient(120% 100% at 0% 0%,var(--panel-hi),var(--bg-deep))}
.step-copy{min-width:0}
.step-copy b{display:block;font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.04em;color:var(--gold);line-height:1}
.step-copy strong{display:block;font-size:18px;margin-top:8px;line-height:1.3}
.step-copy span{display:block;color:var(--text-dim);font-size:13.5px;margin-top:4px;line-height:1.45}
.phone{height:100%;aspect-ratio:9/18;border-radius:14px;border:3px solid var(--mock-bezel);background:var(--mock-screen);padding:13px 7px 8px;display:flex;flex-direction:column;gap:6px;position:relative;font-size:8.5px;line-height:1.3;color:var(--text);overflow:hidden}
.phone::before{content:"";position:absolute;top:4px;left:50%;width:24%;height:3px;border-radius:2px;background:var(--mock-bezel);transform:translateX(-50%)}
.m-row{display:flex;align-items:center;gap:5px;background:var(--panel-hi);border-radius:6px;padding:5px}
.m-ic{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky);flex:none}

.m-txt{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.m-line{height:4px;border-radius:2px;background:var(--line-strong)}
.m-line.s{width:60%}
.m-toggle{margin-left:auto;width:17px;height:10px;border-radius:5px;background:var(--go);position:relative;flex:none}
.m-toggle::after{content:"";position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:var(--go-ink)}
.m-btns{display:flex;gap:4px;margin-top:auto}
.m-btn{flex:1;text-align:center;padding:4px 0;border-radius:5px;background:var(--panel-hi);font-weight:700}

.note-card{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:linear-gradient(160deg,var(--panel-hi),var(--panel) 55%)}
.fit{display:grid;gap:16px}
@media (min-width:640px){.fit{grid-template-columns:1fr 1fr}}
.fit h3{font-size:15px;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.fit h3 .ico{width:16px;height:16px}
.fit .yes h3{color:var(--go)}
.fit .wait h3{color:var(--warn)}
.fit ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--text)}

.req{display:grid;gap:18px}
@media (min-width:640px){.req{grid-template-columns:1fr 1fr}}
.req h3{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}
.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14px}
.kv dt{color:var(--text-dim);white-space:nowrap}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.steps>li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;counter-increment:st;font-size:14.5px}
.steps>li::before{content:counter(st);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--panel-hi);color:var(--sky);font-family:var(--font-display);font-weight:700;font-size:15px}
.steps strong{display:block}
.steps .sub{display:block;color:var(--text-dim);font-size:13.5px;margin-top:2px}
.tip{display:block;margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--text);font-size:13.5px;border-left:3px solid var(--warn)}

.verify-head{display:flex;flex-direction:column;gap:6px}
.verify-head h2{font-size:17px;display:flex;align-items:center;gap:8px}

.tally{display:flex;gap:6px;flex-wrap:wrap}
.checks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.checks .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.checks .st .ico{width:13px;height:13px}
.st.ok{background:var(--go-soft);color:var(--go)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.todo{background:var(--panel-hi);color:var(--text-faint)}

.checks span{display:block;color:var(--text-dim);font-size:13px;line-height:1.5}
details.tech{margin-top:12px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}

.hist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}

.hist-date{color:var(--text-faint);font-size:12.5px}
.hist-item .badge{margin-top:6px}
.hist-item ul{margin:0;padding-left:18px;color:var(--text-dim);font-size:14px;display:flex;flex-direction:column;gap:4px}

.rvsum{display:flex;flex-direction:column;gap:12px}
.rvsum-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.rv-avg{font-family:var(--font-display);font-size:48px;font-weight:700;line-height:1}
.rv-count{font-size:12.5px;color:var(--text-dim);margin-top:4px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:12px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.bar i{display:block;height:7px;border-radius:4px;background:var(--panel-hi);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--sky);border-radius:4px}
.rv-line{font-size:14px}

.reviews{display:flex;flex-direction:column}
.review{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.review-head{display:flex;align-items:center;gap:10px}
.review-head img{width:32px;height:32px;border-radius:50%;flex:none}
.review-who{min-width:0;flex:1}
.review-name{font-weight:600;display:flex;gap:6px;align-items:center}
.review-meta{color:var(--text-faint);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.review-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.rv-form{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line)}
.rv-form-head{display:flex;flex-direction:column;gap:2px}
.star-input{display:flex;gap:2px}
.star-input button{background:none;border:0;padding:4px;color:var(--line-strong);cursor:pointer;border-radius:8px}

input[type=text],input[type=url],input[type=search],textarea,select{width:100%;background:var(--bg-deep);border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--text);font:15px/1.5 var(--font-ui);padding:10px 12px}
textarea{min-height:100px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--text-dim);font-weight:600}
.form{display:flex;flex-direction:column;gap:14px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cboxes{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cbox{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.cbox input{accent-color:var(--go);width:16px;height:16px;margin:0}
.cbox:has(input:checked){border-color:var(--go);background:var(--go-soft)}

.ask{display:flex;flex-direction:column;gap:14px}
.ask-head{display:flex;gap:12px;align-items:flex-start}
.ask-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky);flex:none}
.ask-ic .ico{width:22px;height:22px}
.ask-form{display:flex;gap:8px}
.ask-form input{flex:1;min-width:0}
.ask-out{white-space:pre-wrap;font-size:14.5px;line-height:1.7;padding:14px;border-radius:var(--r-md);background:var(--bg-deep);border:1px solid var(--line)}
.ask-out:empty{display:none}

.kv-card .kv{font-size:13.5px}
.kv-card h2{font-size:16px;margin-bottom:12px}

/* install sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:sheet-up .22s ease-out}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;padding:24px}}
@keyframes sheet-up{from{transform:translateY(18px)}to{transform:none}}
.sheet-head{display:flex;gap:12px;align-items:center}
.sheet-head>div{flex:1;min-width:0}
.sheet-head h2{font-size:18px}
.filecard{border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-deep);padding:14px;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.file-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.file-name{font-family:var(--font-mono);font-size:13.5px;color:var(--text);overflow-wrap:anywhere}
.file-size{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-dim)}
.file-meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;color:var(--text-dim)}
.file-src{color:var(--text-dim);overflow-wrap:anywhere}
.hashline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hashline .lbl{font-family:var(--font-display);font-weight:600;letter-spacing:.08em;color:var(--text-faint)}
.hashline code{font-family:var(--font-mono);font-size:12px;color:var(--text);background:var(--panel);padding:3px 7px;border-radius:5px;overflow-wrap:anywhere;word-break:break-all}
.copy-btn{border:0;background:var(--panel-hi);color:var(--sky);font:600 12.5px/1 var(--font-ui);padding:7px 10px;border-radius:999px;cursor:pointer}
.qr-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.qr-box{background:#ffffff;padding:10px;border-radius:12px;line-height:0;width:max-content}
.qr-box canvas{width:156px;height:156px;display:block}
.qr-fallback{line-height:1.5;color:#0b1420;font-size:13px;max-width:156px}
.qr-copy{display:flex;flex-direction:column;gap:8px}
.qr-copy strong{font-size:15px}
@media (max-width:440px){.qr-wrap{grid-template-columns:1fr;justify-items:center;text-align:center}.qr-copy{align-items:center}}
.mini-steps{margin:0;padding-left:20px;color:var(--text-dim);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.mini-steps b{color:var(--text)}
details.variants{font-size:13px;color:var(--text-dim)}

details.variants ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
details.variants li{display:flex;flex-direction:column;gap:1px}
details.variants .mono{font-size:12px;color:var(--text)}

/* curators + trust */
.process{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:p}
@media (min-width:760px){.process{grid-template-columns:repeat(4,1fr)}}
.process li{counter-increment:p;padding:14px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.process li::before{content:counter(p,decimal-leading-zero);font-family:var(--font-display);font-weight:700;color:var(--gold);font-size:19px;letter-spacing:.06em}
.process strong{font-size:15px}
.process span{color:var(--text-dim);font-size:13.5px}
.queue{display:flex;flex-direction:column}

.q-item:first-child{border-top:0}
.q-title{font-weight:600;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.q-meta{grid-column:1/-1;color:var(--text-faint);font-size:12.5px}
.q-body{grid-column:1/-1;color:var(--text-dim);font-size:14px;overflow-wrap:anywhere}

.q-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;align-self:start}

.status.rejected{background:var(--bad-soft);color:var(--bad)}
.console{border-color:var(--gold-soft)}
.console .eyebrow{margin-bottom:6px}
.pillars{display:grid;gap:12px}
@media (min-width:760px){.pillars{grid-template-columns:1fr 1fr}}
.pillar{display:flex;gap:14px;padding:18px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line)}
.pillar>.ico{width:26px;height:26px;color:var(--go);margin-top:2px}
.pillar strong{display:block;font-size:16px;margin-bottom:4px}
.pillar p{color:var(--text-dim);font-size:14px}
.case{display:flex;flex-direction:column;gap:12px}

.searchbox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line-strong);border-radius:999px;padding:0 18px;color:var(--text-dim)}

.searchbox input{border:0;background:transparent;padding:13px 0;font-size:16px}

.searchbox:focus-within{border-color:var(--sky)}

.appicon>.ico{width:52%;height:52%}
.win{height:76%;aspect-ratio:1/1;border-radius:9px;border:2px solid var(--mock-bezel);background:var(--mock-screen);display:flex;flex-direction:column;overflow:hidden;font-size:8.5px;line-height:1.3;color:var(--text)}
.win-bar{height:12px;flex:none;background:var(--panel-hi);display:flex;gap:3px;align-items:center;padding:0 6px}
.win-bar i{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.win-body{flex:1;padding:8px 7px;display:flex;flex-direction:column;gap:6px;min-height:0}
.m-canvas{flex:1;border-radius:4px;background:linear-gradient(180deg,var(--pc-a),var(--pc-b))}
.m-split{flex:1;display:grid;grid-template-columns:1fr 34%;gap:4px;min-height:0}
.m-col{display:flex;flex-direction:column;gap:3px}
.os-guides{display:grid;gap:12px}
@media (min-width:760px){.os-guides{grid-template-columns:repeat(3,1fr)}}
.os-guide{padding:14px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.os-guide.me{border-color:var(--go)}
.os-guide h3{font-size:15px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.os-guide h3 .ico{width:16px;height:16px;color:var(--text-dim)}
.os-guide ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.me-tag{font-size:11.5px;font-weight:700;color:var(--go);background:var(--go-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.altfiles{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.altfiles li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.altfiles a{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere;min-width:0}
.altfiles span{white-space:nowrap;color:var(--text-faint);font-size:12px}
.copyrow{display:flex;flex-direction:column;gap:8px}
.copyrow>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.cases{display:grid;gap:12px}

  shot: { src: PC_SHOT, alt: L('PhotoCraft 실행 화면: 한국어 메뉴, 왼쪽 도구 막대, 오른쪽 색상·속성·레이어 패널', 'PhotoCraft running: Korean menus, the tool bar on the left, colour, properties and layer panels on the right'), caption: L('실제 실행 화면 · Windows, 한국어 화면', 'Actual app screen · Windows, Korean UI') },
  platformText: L('Windows · macOS · Linux', 'Windows · macOS · Linux'),

function detectDevice() {
  const ua = navigator.userAgent || '';

  else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) platform = 'ios';
  else if (/Windows/i.test(ua)) platform = 'windows';
  else if (/Macintosh|Mac OS X/i.test(ua)) platform = 'mac';
  else if (/Linux|X11|CrOS/i.test(ua)) platform = 'linux';

    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (gl) {

      gpu = String((ext && gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) || gl.getParameter(gl.RENDERER) || '');
      const lose = gl.getExtension('WEBGL_lose_context');
      if (lose) lose.loseContext();
    }
  } catch (e) { gpu = ''; }
  const reduced = /Android 10; K\)/.test(ua);
  const vm = ua.match(/Android\s+(\d+)/i);
  let arch = '';
  if (/aarch64|arm64/i.test(ua) && platform !== 'android') arch = 'arm64';
  else if (/WOW64|Win64|x86_64|x64|amd64/i.test(ua)) arch = 'x64';
  S.device = Object.assign({ platform, gpu, model: '', arch, androidVer: (!reduced && vm) ? vm[1] : '' }, classify(platform, gpu));
  const uad = navigator.userAgentData;
  if (uad && typeof uad.getHighEntropyValues === 'function') {
    uad.getHighEntropyValues(['model', 'platformVersion', 'architecture', 'bitness']).then(v => {
      if (!v) return;
      if (platform === 'android') {
        if (v.model) S.device.model = String(v.model).slice(0, 40);
        if (v.platformVersion) S.device.androidVer = String(v.platformVersion).split('.')[0];
      } else if (v.architecture === 'arm') S.device.arch = 'arm64';
      else if (v.architecture === 'x86') S.device.arch = v.bitness === '32' ? 'x86' : 'x64';
      fillDevice();

}

function subPlats(it) {
  const raw = Array.isArray(it.platforms) ? it.platforms : (it.platform ? [it.platform] : []);
  return [...new Set(raw.map(String).filter(p => PLATS[p]))];
}
function allSubs() {
  const out = [];
  for (const d of S.subDocs || []) {
    const items = Array.isArray(d.items) ? d.items : [];
    for (const it of items) {
      if (!it || typeof it !== 'object' || !it.id) continue;
      const repo = parseRepo(it.repo);
      if (!repo) continue;
      const key = d.uid + '__' + String(it.id);
      const dec = S.decisions && typeof S.decisions[key] === 'object' ? S.decisions[key] : null;
      const status = dec && ['approved', 'rejected'].includes(dec.status) ? dec.status : 'pending';
      out.push({ key, uid: d.uid, id: String(it.id), repo, category: String(it.category || ''), plats: subPlats(it), pitch: String(it.pitch || '').slice(0, 120), why: String(it.why || '').slice(0, 600), at: Number(it.at) || 0, status });
    }
  }
  return out.sort((x, y) => y.at - x.at);
}

function fill(slot, html) {

async function refreshDynamic() {
  const seq = ++dynSeq;
  const ids = new Set();
  for (const id of Object.keys(S.rv)) S.rv[id].list.forEach(r => r.id && ids.add(r.id));
  (S.subDocs || []).forEach(d => d.uid && ids.add(d.uid));
  (S.curatorApps || []).forEach(x => x.uid && ids.add(x.uid));
  if (S.user && ids.size) {
    try { const ps = await S.user.profiles([...ids]); if (seq !== dynSeq) return; S.ps = ps || {}; } catch (e) {}
  }
  if (seq !== dynSeq) return;
  fill('featrv'); fill('rvchip'); fill('stats'); fill('rvsum'); fill('rvlist');
  if (rvMode() !== S.rvMode) { S.rvMode = rvMode(); fill('rvform'); }
  syncRvForm();

/* actions */
async function copyToClipboard(text, btn, codeEl, doneLabel) {
  const reset = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = doneLabel;
  } catch (e) {
    if (codeEl) {
      codeEl.style.display = '';
      codeEl.textContent = text;
      const range = document.createRange();
      range.selectNodeContents(codeEl);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
    }
    btn.textContent = T('선택됨', 'Selected');
  }
  setTimeout(() => { if (document.contains(btn)) btn.textContent = reset; }, 1800);
}
async function recordInstall(appId, plat) {
  if (!S.db || !S.me || !S.me.id || !appById(appId)) return;
  try { await S.db.doc(`apps/${appId}/installs/${S.me.id}`).set({ v: appById(appId).release.version, plat: plat || '', at: Date.now() }); } catch (e) {}
}
function arm(btn, label) {
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1';
  const old = btn.textContent;
  btn.textContent = label;
  setTimeout(() => { if (document.contains(btn)) { btn.dataset.armed = ''; btn.textContent = old; } }, 3500);
  return false;
}

async function decide(key, status, btn) {

async function decideCurator(uid, ok, btn) {

      const cur = Object.assign({}, S.roles && typeof S.roles.curators === 'object' ? S.roles.curators : {});
      cur[uid] = { at: Date.now() };
      await S.db.doc('ops/roles').set(Object.assign({}, S.roles, { curators: cur }));
      await S.db.doc('curatorApps/' + uid).update({ status: 'approved' });
    } else {
      await S.db.doc('curatorApps/' + uid).update({ status: 'rejected' });
    }
  } catch (e) { btn.disabled = false; }

function buildPrompt(a, q) {
  const d = S.device;
  const dev = d.platform === 'android'
    ? `Android phone. Model: ${d.model || 'unknown'}. Android version: ${d.androidVer || 'unknown'}. GPU: ${d.gpu || 'unknown'}.${a.device === 'gpu' ? ` Naru's auto-check verdict: ${d.verdict}.` : ''}`
    : d.platform === 'ios' ? 'iPhone or iPad.' : `A computer: ${platLabel(d.platform) || d.platform}${d.arch ? ', CPU ' + d.arch : ''}.`;
  return `You are the install helper of "Naru" (나루), a curated store that helps people who are not good with computers install vetted programs from GitHub.
Answer the visitor's question about the app below using ONLY these facts. If the facts don't cover it, say you're not sure and point to the official GitHub page. Never invent device or feature support. If the visitor's device can't run it, say so clearly and kindly.
Reply in ${S.lang === 'ko' ? 'Korean, in friendly polite speech (해요체)' : 'English'}. Plain words for a non-technical person, 2 to 5 short sentences, no headings, no lists, no tables, no markdown.

APP FACTS
- ${a.facts.join('\n- ')}

VISITOR DEVICE (auto-detected, may be wrong): ${dev}

QUESTION: ${q}`;
}
function setAskBusy(b) {
  const askBtn = $('#ask-btn'), stop = $('#ask-stop');
  if (askBtn) askBtn.disabled = b;
  if (stop) stop.hidden = !b;
  $$('[data-act=ask-chip]').forEach(x => { x.disabled = b; });

async function ask(q) {
  const out = $('#ask-out');
  const form = $('#ask-form');
  const a = form ? appById(form.dataset.app) : null;
  if (!S.sample || !out || !a) return;
  const question = String(q || '').trim().slice(0, 300);
  if (!question) return;
  if (S.askCtl) S.askCtl.abort();
  const ctl = new AbortController();
  S.askCtl = ctl;
  out.textContent = T('생각하는 중…', 'Thinking…');
  setAskBusy(true);
  try {
    const res = await S.sample(buildPrompt(a, question), { modelTier: 'quick', signal: ctl.signal, onText: ({ text }) => { out.textContent = text; } });
    out.textContent = res.text;
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') { out.textContent = (e && e.text) || ''; }
    else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { const card = $('#ask-card'); if (card) card.hidden = true; }
    else if (code === 'rate_limited') { out.textContent = ((e && e.text) ? e.text + '\n\n' : '') + T('질문이 많이 몰렸어요. 잠시 뒤에 다시 물어봐 주세요.', 'Too many questions right now. Ask again in a little while.'); }
    else if (code === 'refused') { out.textContent = T('이 질문에는 답할 수 없어요. 다르게 물어봐 주세요.', 'That one can’t be answered. Try asking differently.'); }
    else { out.textContent = ((e && e.text) ? e.text + '\n\n' : '') + T('답을 받지 못했어요. 다시 눌러 주세요.', 'No answer came back. Tap to try again.'); }
  } finally {
    if (S.askCtl === ctl) { S.askCtl = null; setAskBusy(false); }
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'lang') { const l = el.dataset.lang; if (l !== S.lang) { S.lang = l; saveLang(); render(); refreshDynamic(); } return; }
  if (act === 'install') { openInstall(el); return; }
  if (act === 'close') { closeInstall(); return; }
  if (act === 'copy-hash') { copyToClipboard(el.dataset.hash, el, $('#hash-code'), T('복사됨', 'Copied')); return; }
  if (act === 'copy-link') { copyToClipboard(el.dataset.url, el, document.getElementById(el.dataset.target), T('복사됨', 'Copied')); return; }
  if (act === 'dl') { recordInstall(el.dataset.app, el.dataset.plat); return; }
  if (act === 'cat') {
    S.cat = el.dataset.cat;
    $$('#cat-chips .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === S.cat)));
    const rows = $('#home-rows'); if (rows) rows.innerHTML = rowsHTML();
    return;
  }
  if (act === 'star') { const f = el.closest('form'); if (f) { f.dataset.touched = '1'; setFormStars(f, Number(el.dataset.n)); } return; }
  if (act === 'rv-del-mine') {
    const f = $('#rv-form');
    if (!f || !arm(el, T('한 번 더 누르면 삭제', 'Tap again to delete'))) return;
    if (S.db && S.me && S.me.id) S.db.doc(`apps/${f.dataset.app}/reviews/${S.me.id}`).delete().then(() => {
      f.reset(); f.dataset.filled = ''; f.dataset.touched = ''; setFormStars(f, 0);
      const m = $('#rv-msg'); if (m) { m.className = 'note'; m.textContent = T('리뷰를 삭제했어요.', 'Review deleted.'); }
    }).catch(() => {});
    return;
  }
  if (act === 'rv-mod') {
    if (!arm(el, T('한 번 더 누르면 삭제', 'Tap again to remove'))) return;
    if (S.isOwner && S.db && appById(el.dataset.app)) S.db.doc(`apps/${el.dataset.app}/reviews/${el.dataset.id}`).delete().catch(() => {});
    return;
  }
  if (act === 'decide') { decide(el.dataset.key, el.dataset.status, el); return; }
  if (act === 'cur-ok') { decideCurator(el.dataset.uid, true, el); return; }
  if (act === 'cur-no') { decideCurator(el.dataset.uid, false, el); return; }
  if (act === 'ask-chip') { const i = $('#ask-input'); if (i) i.value = el.dataset.q; ask(el.dataset.q); return; }
  if (act === 'ask-stop') { if (S.askCtl) S.askCtl.abort(); return; }
  if (act === 'suggest') { S.q = el.dataset.q; const i = $('#q'); if (i) i.value = S.q; fill('results', searchResultsHTML()); return; }
});
document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'rv-form') submitReview(f);
  else if (f.id === 'sub-form') submitPick(f);
  else if (f.id === 'apply-form') submitApply(f);
  else if (f.id === 'ask-form') ask($('#ask-input').value);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; fill('results', searchResultsHTML()); }
  const f = e.target.closest && e.target.closest('#rv-form');
  if (f) f.dataset.touched = '1';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInstall(); });

/* capabilities */
function subscribeAll() {
  const db = S.db;
  const timer = setTimeout(() => { if (!Object.values(S.rv).every(x => x.loaded)) { S.stale = true; refreshDynamic(); } }, 10000);
  for (const a of CATALOG) {
    db.collection(`apps/${a.id}/reviews`).onSnapshot(snap => {
      S.rv[a.id] = { list: snap.docs.map(d => Object.assign({}, d.data() || {}, { id: d.id })), loaded: true };
      if (!snap.metadata.fromCache && Object.values(S.rv).every(x => x.loaded)) { clearTimeout(timer); S.stale = false; }
      refreshDynamic();
    }, () => { S.rv[a.id].loaded = true; refreshDynamic(); });
    db.collection(`apps/${a.id}/installs`).onSnapshot(snap => {
      S.inst[a.id] = { n: snap.size, loaded: true }; refreshDynamic();
    }, () => {});
  }
  db.doc('ops/roles').onSnapshot(s => { S.roles = s.exists ? (s.data() || {}) : {}; refreshDynamic(); }, () => {});
  db.doc('ops/decisions').onSnapshot(s => { S.decisions = s.exists ? (s.data() || {}) : {}; refreshDynamic(); }, () => {});
  db.collection('submissions').onSnapshot(snap => {
    S.subDocs = snap.docs.map(d => Object.assign({}, d.data() || {}, { uid: d.id }));
    refreshDynamic();
  }, () => {});
  if (S.isOwner) {
    db.collection('curatorApps').onSnapshot(snap => {
      S.curatorApps = snap.docs.map(d => Object.assign({}, d.data() || {}, { uid: d.id }));
      refreshDynamic();
    }, () => {});
  } else if (S.me && S.me.id) {
    db.doc('curatorApps/' + S.me.id).onSnapshot(s => { S.myCuratorApp = s.exists ? (s.data() || {}) : null; refreshDynamic(); }, () => {});
  }
}
async function initCaps() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.capsChecked = true; refreshDynamic(); return; }
  let db = null, user = null, sample = null;
  try { [db, user, sample] = await Promise.all([c.use('db'), c.use('user'), c.use('sample')]); } catch (e) {}
  S.sample = sample || null;
  if (user) {
    S.user = user;
    try { S.me = await user.me(); } catch (e) { S.me = null; }
    S.isOwner = !!(S.me && S.me.isOwner);
    try { S.canWrite = await user.can('data.write'); } catch (e) { S.canWrite = null; }
  }
  S.db = db || null;
  S.capsChecked = true;
  render();
  refreshDynamic();
  if (S.db) subscribeAll();
}

detectDevice();
S.store = savedStore() || (S.device.platform === 'android' ? 'android' : 'pc');
S.route = routeFromHash();
if (S.route === 'pc' || S.route === 'android') S.store = S.route;
render();
initCaps();
})();
</script>
